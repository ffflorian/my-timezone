pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,css,md,json,yml,yaml}'
      exclude:
        - 'CLAUDE.md'
        - '.claude'
      run: npx --no oxfmt {staged_files} && git add {staged_files}
    oxlint:
      glob: '*.{js,ts,jsx,tsx}'
      run: npx --no oxlint -- --ignore-path .gitignore --fix {staged_files} && git add {staged_files}
